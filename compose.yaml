services:
  compiler:
    build: .
    volumes:
      - .:/app
      - zig-cache:/root/.cache/zig
      - local-cache:/app/.zig-cache
      - build:/output
    healthcheck:
      test: ["CMD", "test", "-f", "/output/city.wasm"]
      interval: 2s
      timeout: 1s
      retries: 60
  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - build:/build:ro
    depends_on:
      compiler:
        condition: service_healthy
volumes:
  zig-cache:
  local-cache:
  build:
